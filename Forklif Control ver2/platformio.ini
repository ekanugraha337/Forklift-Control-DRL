; Forklift Control v2 - Waveshare ESP32-S3-Nano
;
; Sengaja TIDAK memakai board = arduino_nano_esp32: profil itu memakai upload
; protocol DFU (bootloader khas Arduino, tidak ada di Waveshare), konfigurasi
; PSRAM modul NORA-W106, dan pin remap Arduino. Dengan profil generik di bawah
; ini, nomor pin di kode = nomor GPIO ESP32-S3 yang sebenarnya.

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
; default_16MB.csv punya dua slot aplikasi (ota_0 / ota_1) - wajib untuk OTA,
; dan partisi nvs untuk Preferences.h.
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
    -DARDUINO_USB_MODE=1          ; pakai USB-Serial/JTAG bawaan ESP32-S3
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial diarahkan ke USB

monitor_speed = 115200

lib_deps =
    ; Pulsa STEP dibangkitkan peripheral RMT/MCPWM, bukan di loop(), sehingga
    ; gerak motor tidak terganggu aktivitas WiFi/OTA/MQTT.
    gin66/FastAccelStepper@^1.2.7
    knolleary/PubSubClient@^2.8
    ; Baru di v2: TMC2209 dikendalikan lewat UART (PDN_UART), bukan lagi
    ; standalone dengan trimpot Vref + jumper MS1/MS2.
    teemuatlut/TMCStepper@^0.7.3

; --- Upload lewat kabel USB. Wajib dipakai untuk flash PERTAMA kali, -------
; --- karena OTA baru hidup setelah firmware ber-ArduinoOTA ada di board. ---
[env:usb]
upload_protocol = esptool

; --- Upload lewat WiFi (OTA). Pakai setelah env:usb berhasil sekali. -------
; Memakai alamat IP langsung (lebih andal daripada mDNS). IP board tersimpan di
; NVS (setelan "ip", bawaan 10.210.1.101), jadi kalau alamat itu diubah lewat
; MMI, baris upload_port di bawah harus ikut diubah. Verifikasi dengan perintah
; "show net" di MMI; nama mDNS forklift-control.local tetap bisa dipakai.
[env:ota]
upload_protocol = espota
upload_port = 10.210.1.101
upload_flags =
    --port=3232
    ; Port di sisi PC yang dihubungi balik board untuk mengirim firmware.
    ; Dipatok (bukan acak) supaya cukup satu aturan firewall inbound:
    ;   New-NetFirewallRule -DisplayName "PlatformIO OTA" -Direction Inbound `
    ;     -Protocol TCP -LocalPort 3232 -RemoteAddress 10.210.1.101 -Action Allow
    --host_port=3232
    --auth=forklift123

; Memantau board:
;   MMI    : telnet 10.210.1.101 23      -> lalu "debug on"
;   MQTT   : mosquitto_sub -h 10.210.1.1 -t 'forklift01/#' -v
;   Serial : pio device monitor -e usb


; jangan dihapus ---
;& "$env:USERPROFILE\.platformio\penv\Scripts\pio.exe" run -e ota -t upload --upload-port 10.210.1.101
